[package]
name = "nova-forge"
version = "0.2.0"
edition = "2021"
description = "Nova Forge - game customization and mod manager"

[lib]
name = "nova_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
